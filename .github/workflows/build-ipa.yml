name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and WidgetKit extension
        run: >-
          xcodebuild -project Date-iOS.xcodeproj -scheme Date-iOS -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify widget is embedded
        run: |
          test -d build/Build/Products/Release-iphoneos/Date-iOS.app/PlugIns/DateWidget.appex
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Build/Products/Release-iphoneos/Date-iOS.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/Build/Products/Release-iphoneos/Date-iOS.app/PlugIns/DateWidget.appex/Info.plist

      - name: Create ESign-ready IPA
        run: |
          rm -rf Payload Date-iOS-Widgets.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Date-iOS.app Payload/Date-iOS.app
          zip -qry Date-iOS-Widgets.ipa Payload
          unzip -l Date-iOS-Widgets.ipa | grep -E "Date-iOS.app/PlugIns/DateWidget.appex|Date-iOS.app/Info.plist"

      - name: Create app-only diagnostic IPA
        run: |
          rm -rf Payload-AppOnly Date-iOS-AppOnly.ipa
          mkdir -p Payload-AppOnly
          cp -R build/Build/Products/Release-iphoneos/Date-iOS.app Payload-AppOnly/Date-iOS.app
          rm -rf Payload-AppOnly/Date-iOS.app/PlugIns
          zip -qry Date-iOS-AppOnly.ipa Payload-AppOnly
          unzip -l Date-iOS-AppOnly.ipa | grep -E "Date-iOS.app/Info.plist"

      - name: Upload app-only diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: Date-iOS-AppOnly-IPA
          path: Date-iOS-AppOnly.ipa
          if-no-files-found: error

      - name: Upload widget IPA
        uses: actions/upload-artifact@v4
        with:
          name: Date-iOS-Widgets-IPA
          path: Date-iOS-Widgets.ipa
          if-no-files-found: error
